# The suite, and then the two claims the suite cannot make on its own.
#
# The corpus is BUILT here, before pytest, and that is not a convenience. It is
# derived and it expires -- several axiom arms count inside a window measured
# backwards from now -- so it is gitignored and `make_corpus.py` stamps it at
# build time. A fresh clone that runs pytest without this step fails seven tests
# on a missing file, which reads as a broken package rather than a missing step.
#
# The extras are installed on purpose. Without `[vertical]` the agreement test
# is skipped by `importorskip`, and a check that silently stopped running is
# worse than no check at all -- so the skip count is asserted to be zero rather
# than read off a log nobody opens.

name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every interpreter `requires-python` admits, not just the one this workflow
  # happened to name. The floor is 3.10 because both extras resolve only there:
  # `arbiter-engine` and `presence-audit` each declare `>=3.10`.
  versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install, with the engine and the neutral core
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet -e '.[detect,vertical]' pytest
          python3 -m pip show arbiter-engine | sed -n 's/^Version: /  engine  /p'
          python3 -m pip show presence-audit | sed -n 's/^Version: /  core    /p'
      - name: The corpus, stamped now
        run: python3 battery/make_corpus.py
      - name: The suite
        run: python3 -m pytest tests/ -q
      # The one battery leg that asks the CORE whether it still accepts this
      # vertical, rather than asking this package whether it agrees with itself.
      # The rest of the battery stays a hand-run script -- it wants a live OPC UA
      # server and builds a wheel. This leg costs two imports and the extra is
      # already installed above, so there is no reason for it to wait for
      # somebody to remember. It is run on every interpreter for the same reason
      # the suite is: the answer comes from an installed dependency, and which
      # release resolves can differ by interpreter.
      - name: The core's own kit still accepts this vertical
        run: python3 battery/probe_conformance.py

  # The two legs that need a server. The rest of the battery stays a hand-run
  # script: it builds a wheel and installs every release in two ranges. These
  # two want an anonymous OPC UA server on localhost that plays the corpus once
  # and stops, which a runner does in seconds -- and they cover the only verb
  # here that talks to anything.
  #
  # Nothing ran them automatically until 2026-09-09. Every defect `capture`
  # had on the day it was written -- a register read as the wrong shape, a
  # membership cache that answered for a different server, an edit that left
  # the old code live -- was found by running it, and none of them would have
  # been caught by anything on this file.
  #
  # `[live]` alone, and not the other extras: `capture` is Stage 1 work and
  # should not need an axiom engine to read a server. Installing one here would
  # stop this job from being able to say so.
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install, with the OPC UA client and nothing else
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet -e '.[live]'
          python3 -m pip show asyncua | sed -n 's/^Version: /  asyncua /p'
      - name: The corpus, stamped now
        run: python3 battery/make_corpus.py
      - name: A real server, read by the shipped client
        run: python3 battery/run_battery.py --only live --only capture

      # P4. Every status word the client library can hand this package, graded.
      # Written against the surface's three words this would measure the corpus;
      # the population that matters is what a real PLC can produce. It found 36
      # of 274 misgraded on the day it was written, including the one the
      # substituted-sample count exists for.
      - name: Every status word the client library can report
        run: python3 battery/probe_status_words.py

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the commit-message and authorship steps need the
          # commits in this push, and the default depth of 1 would leave them
          # checking only the tip.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stage 1 carries no dependency, installed rather than described
        # The package's headline claim, and the suite cannot make it: the suite
        # runs wherever it is run, including an environment something else
        # populated. This installs the bare package into an empty environment,
        # asserts nothing arrived with it, and then runs Stage 1 there.
        run: |
          set -euo pipefail
          # Compared as distribution NAMES, not as freeze lines. `pip freeze`
          # spells a local install `name @ file://...` rather than `name==0.1.0`,
          # so the first version of this step stripped nothing and the package
          # counted itself as a stray dependency. The claim is about what else
          # arrived; the predicate has to be about that too.
          names() { /tmp/bare/bin/python -m pip list --format=freeze \
                    | sed 's/[ =@].*//' | tr 'A-Z_' 'a-z-' | sort -u; }
          python3 -m venv /tmp/bare
          BEFORE=$(names)
          /tmp/bare/bin/pip install --quiet .
          EXTRA=$(comm -13 <(echo "${BEFORE}") <(names) | grep -vx 'factory-line-audit' || true)
          if [ -n "${EXTRA}" ]; then
            echo "::error::installing the bare package brought: ${EXTRA}"
            exit 1
          fi
          # Non-vacuity: the comparison must be able to SEE an arrival, or a
          # clean result means only that the probe is blind.
          /tmp/bare/bin/pip install --quiet 'arbiter-engine>=0.1.10,<0.2'
          SEEN=$(comm -13 <(echo "${BEFORE}") <(names) | grep -vx 'factory-line-audit' || true)
          if [ -z "${SEEN}" ]; then
            echo "::error::the check cannot see a dependency that IS there"
            exit 1
          fi
          echo "  it can see an arrival (${SEEN}); the bare install had none"
          python3 battery/make_corpus.py
          /tmp/bare/bin/factory-line-audit presence \
            --register examples/asset_register.json \
            --walk battery/corpus/clean.json > /tmp/presence.json
          test -s /tmp/presence.json
          echo "  Stage 1 ran with nothing else installed"

      - name: Install, with the engine and the neutral core
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet -e '.[detect,live,vertical]' pytest

      - name: The suite, with nothing skipped
        # A skip here means the `[vertical]` extra did not arrive and the
        # agreement between the two presence paths went unchecked. That is the
        # one test whose absence is invisible in a green run.
        run: |
          set -euo pipefail
          python3 battery/make_corpus.py
          python3 -m pytest tests/ -q -rs | tee /tmp/suite.txt
          if grep -qE '[0-9]+ skipped' /tmp/suite.txt; then
            echo "::error::a test was skipped; see the reasons above"
            exit 1
          fi

      - name: The gate refuses an unreviewed statement, by name
        # Non-vacuity for the review gate: every run above is expected to
        # succeed, so a build that had broken into accepting anything would sail
        # through them. `draft` must emit and exit clean; `gate` must then
        # refuse that exact file and name it.
        run: |
          set -euo pipefail
          factory-line-audit draft --register examples/asset_register.json --out /tmp/draft.json
          set +e
          factory-line-audit gate --register examples/asset_register.json /tmp/draft.json > /tmp/gate.txt 2>&1
          code=$?
          set -e
          test "${code}" -eq 2 || { echo "expected 2 (could not complete), got ${code}"; exit 1; }
          grep -q "draft.json" /tmp/gate.txt || { echo "the refusal did not name the file"; cat /tmp/gate.txt; exit 1; }
          factory-line-audit gate --register examples/asset_register.json \
            examples/declarations/line1.fixture.json
          echo "  refused the draft by name, and let the self-disclosed fixture through"

      - name: Hygiene sweep
        # The same check the hook runs, over the whole tree rather than the
        # staged diff. This is the backstop for every commit made from a clone
        # where the hook was never enabled -- `core.hooksPath` is per-clone, so
        # that is every fresh clone until somebody remembers.
        run: python3 tools/hygiene_check.py --all

      - name: Commit messages
        # The commit-msg hook's backstop, and the reason this is not optional: a
        # message is the one published surface no later commit can correct.
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before || '' }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no usable base ref; checking HEAD only"
            LIST=$(git rev-parse HEAD)
          else
            LIST=$(git rev-list "$BASE..${{ github.sha }}")
            echo "checking $(echo "$LIST" | grep -c . ) commit message(s) in $BASE..${{ github.sha }}"
          fi
          FAILED=0
          for SHA in $LIST; do
            git log -1 --format=%B "$SHA" > /tmp/msg.txt
            echo "--- $SHA"
            python3 tools/commit_msg_check.py /tmp/msg.txt || FAILED=1
          done
          exit $FAILED

      - name: Authorship
        # A commit's author is neither its message nor a file in it, so neither
        # check above can see it. A local `user.email` quietly beat the global
        # one and a personal address reached 24 published commits. The hook
        # checks the setting before the commit; this checks the RESULT after it,
        # which is the thing that actually gets published.
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before || '' }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            LIST=$(git rev-parse HEAD)
          else
            LIST=$(git rev-list "$BASE..${{ github.sha }}")
          fi
          FAILED=0
          for SHA in $LIST; do
            for WHO in $(git log -1 --format='%ae%n%ce' "$SHA"); do
              case "$WHO" in
                *@users.noreply.github.com|*@noreply.github.com) ;;
                *) echo "::error::$SHA carries a real address in its authorship"; FAILED=1 ;;
              esac
            done
          done
          exit $FAILED
